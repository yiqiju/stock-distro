# Local, single-user Grafana for the portfolio dashboards. Bound to localhost only.
[server]
http_addr = 127.0.0.1
http_port = 3000

[auth.anonymous]
enabled = true
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false
